[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-gnn-routing"
version = "0.1.0"
description = "Standalone LSTM runoff generation and GNN streamflow routing experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "ruamel.yaml",
  "torch",
  "torch-geometric",
  "tqdm",
  "xarray",
]

[project.optional-dependencies]
preprocess = [
  "geopandas",
  "matplotlib",
  "netCDF4",
  "pyproj",
  "zarr",
]

database = [
  "duckdb",
  "pyarrow",
]

dashboard = [
  "streamlit",
  "plotly",
  "duckdb",
  "pyarrow",
]

dev = [
  "pytest",
  "ruff",
]

all = [
  "lstm-gnn-routing[preprocess,database,dashboard,dev]",
]

[project.scripts]
lstm-gnn-routing = "lstm_gnn_routing.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "data",
  "runs",
  "configs",
  "scalers",
  "paper_analysis",
  "notebooks",
]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]