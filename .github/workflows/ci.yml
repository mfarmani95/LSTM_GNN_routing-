name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: |
          uv sync --dev

      - name: Lint
        run: |
          uv run python -m ruff check src tests

      - name: Test
        run: |
          uv run pytest tests
